name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check mod.ts

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts mod_test.ts

      - name: Test
        run: deno test --doc
